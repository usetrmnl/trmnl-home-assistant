name: Cache Cleanup

on:
  # NOTE: pull_request_target so fork PRs get a write token; never check out PR code here.
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    name: Clean PR Cache
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup PR caches
        uses: actions/github-script@v7
        with:
          script: |
            const ref = `refs/pull/${context.issue.number}/merge`;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
              per_page: 100,
            });

            console.log(`Found ${caches.length} cache(s) for PR #${context.issue.number}`);

            for (const cache of caches) {
              console.log(`Deleting cache: ${cache.key} (${cache.size_in_bytes} bytes)`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }

            console.log('Cache cleanup complete');
