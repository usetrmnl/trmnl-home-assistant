name: CI

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  CACHE_REPO: ${{ github.repository_owner }}/trmnl-ha-cache
  TERMINUS_CACHE_REPO: ${{ github.repository_owner }}/trmnl-terminus-cache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('trmnl-ha/ha-trmnl/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: trmnl-ha/ha-trmnl
        run: bun install

      - name: Run ESLint
        working-directory: trmnl-ha/ha-trmnl
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('trmnl-ha/ha-trmnl/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install ImageMagick 7 (Q16-HDRI)
        run: |
          # Start a container from the same IM7 image used in production
          docker create --name im7 --entrypoint "" \
            dpokidov/imagemagick:7.1.1-47-bookworm tail -f /dev/null
          docker start im7

          # Copy IM7 binary, libraries, and config via docker cp
          sudo docker cp im7:/usr/local/bin/magick /usr/local/bin/
          sudo docker cp im7:/usr/local/lib/. /usr/local/lib/
          sudo docker cp im7:/usr/local/etc/ImageMagick-7/ /usr/local/etc/ImageMagick-7/

          # Copy system libraries that Ubuntu 24.04 doesn't provide.
          # NOTE: -L follows symlinks so we get the actual .so file, not a broken link.
          # libjpeg62-turbo: Ubuntu has libjpeg-turbo8 (different soname)
          # libomp5: not installed by default on Ubuntu
          sudo docker cp -L im7:/usr/lib/x86_64-linux-gnu/libjpeg.so.62 /usr/local/lib/
          sudo docker cp -L im7:/usr/lib/x86_64-linux-gnu/libomp.so.5 /usr/local/lib/

          docker stop im7 && docker rm im7

          # Wrapper script: gm package calls 'convert', IM7 uses 'magick'
          sudo cp trmnl-ha/ha-trmnl/scripts/imagemagick-wrapper.sh /usr/local/bin/convert
          sudo chmod +x /usr/local/bin/convert
          sudo ln -sf /usr/local/bin/magick /usr/local/bin/identify
          sudo ln -sf /usr/local/bin/magick /usr/local/bin/mogrify
          sudo ldconfig

          # Verify — must show "ImageMagick 7" and "Q16-HDRI"
          /usr/local/bin/magick --version

      - name: Install dependencies
        working-directory: trmnl-ha/ha-trmnl
        run: bun install

      - name: Create test options file
        working-directory: trmnl-ha/ha-trmnl
        run: cp options-dev.json.example options-dev.json

      - name: Run unit tests
        working-directory: trmnl-ha/ha-trmnl
        run: bun test tests/unit

      - name: Run integration tests
        working-directory: trmnl-ha/ha-trmnl
        run: MOCK_HA=true bun test tests/integration

      - name: Check coverage
        working-directory: trmnl-ha/ha-trmnl
        run: bun test --coverage

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # NOTE: Write to packages needed for registry cache on push to main
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR for registry cache (read for PRs, write for push)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: Registry cache is branch-agnostic - PR builds reuse main's cache!
      # On push to main: update the shared registry cache
      # On PR: read from registry cache, write to GHA cache (branch-scoped fallback)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: trmnl-ha
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: trmnl-ha:test-${{ matrix.tag }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_REPO }}:${{ matrix.tag }}
            type=gha,scope=build-${{ matrix.tag }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:{2},mode=max', env.REGISTRY, env.CACHE_REPO, matrix.tag) || format('type=gha,mode=max,scope=build-{0}', matrix.tag) }}
          provenance: false

      - name: Verify both runtimes are in the image
        run: |
          docker run --rm trmnl-ha:test-${{ matrix.tag }} bun --version
          docker run --rm trmnl-ha:test-${{ matrix.tag }} node --version

      # Boots the image and waits for /health. Runs once per runtime: the
      # default (Bun) path and the Node fallback (RUNTIME=node), so the Node
      # path cannot silently break. A dummy HA URL is fine — /health reports
      # browser state and does not require HA to be reachable.
      - name: Smoke test both runtimes
        run: |
          set -e
          smoke() {
            local name=$1 expect_log=$2
            shift 2
            docker run -d --name "$name" -p 10000:10000 \
              -e HOME_ASSISTANT_URL=http://127.0.0.1:1 -e ACCESS_TOKEN=dummy \
              "$@" trmnl-ha:test-${{ matrix.tag }} >/dev/null
            for i in $(seq 1 45); do
              curl -sf http://localhost:10000/health >/dev/null 2>&1 && break
              sleep 2
            done
            curl -sf http://localhost:10000/health >/dev/null \
              || { echo "::error::$name did not become healthy"; docker logs "$name"; exit 1; }
            docker logs "$name" 2>&1 | grep -q "$expect_log" \
              || { echo "::error::$name log missing: $expect_log"; docker logs "$name"; exit 1; }
            curl -sf http://localhost:10000/js/app.js >/dev/null \
              || { echo "::error::$name failed to serve transpiled frontend"; exit 1; }
            echo "$name OK"
            docker rm -f "$name" >/dev/null
          }
          smoke bun-runtime "Starting TRMNL HA"
          smoke node-runtime "Starting under Node" -e RUNTIME=node

  build-terminus:
    name: Build Terminus Add-on (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
            arch: amd64
          - platform: linux/arm64
            tag: arm64
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      # Rejects a non-compiling profile before it reaches a real install.
      - name: Load AppArmor profile
        id: apparmor
        if: matrix.tag == 'amd64'
        run: |
          set -e
          command -v apparmor_parser >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq apparmor
          }
          apparmor_parser -Q -d trmnl-terminus/apparmor.txt >/dev/null
          echo "profile compiles"

          if [ ! -d /sys/kernel/security/apparmor ]; then
            echo "::warning::Runner kernel has no AppArmor; enforcement not tested"
            echo "enforced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apparmor_parser -r -W trmnl-terminus/apparmor.txt
          echo "enforced=true" >> "$GITHUB_OUTPUT"
          echo "profile loaded and enforcing"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Supervisor supplies BUILD_FROM from build.yaml; plain buildx does not.
      - name: Resolve Terminus base image
        id: base
        working-directory: trmnl-terminus
        run: echo "image=$(grep "^  ${{ matrix.arch }}:" build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build add-on image
        uses: docker/build-push-action@v5
        with:
          context: trmnl-terminus
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: trmnl-terminus:test-${{ matrix.tag }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.TERMINUS_CACHE_REPO }}:${{ matrix.tag }}
            type=gha,scope=terminus-${{ matrix.tag }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:{2},mode=max', env.REGISTRY, env.TERMINUS_CACHE_REPO, matrix.tag) || format('type=gha,mode=max,scope=terminus-{0}', matrix.tag) }}
          provenance: false

      # The boot test below starts the add-on with ha_ip alone, so nothing
      # there exercises an option. This does.
      - name: Test add-on option handling
        if: matrix.tag == 'amd64'
        run: trmnl-terminus/tests/init-environment.test.sh trmnl-terminus:test-amd64

      # amd64 only - QEMU makes arm64 boot tests too slow here.
      - name: Smoke test add-on boot
        if: matrix.tag == 'amd64'
        run: |
          set -e
          echo '{"ha_ip":"127.0.0.1"}' > /tmp/options.json

          if [ "${{ steps.apparmor.outputs.enforced }}" = "true" ]; then
            SECURITY_OPT="--security-opt=apparmor=trmnl-terminus"
          else
            SECURITY_OPT=""
          fi

          # shellcheck disable=SC2086
          docker run -d --name terminus-smoke -p 2300:2300 \
            $SECURITY_OPT \
            -v /tmp/options.json:/data/options.json \
            trmnl-terminus:test-amd64 >/dev/null

          # -L: /up redirects to /login, matching the Supervisor's own watchdog check.
          for _ in $(seq 1 90); do
            curl -fsL http://localhost:2300/up >/dev/null 2>&1 && break
            sleep 2
          done

          curl -fsL http://localhost:2300/up >/dev/null || {
            echo "::error::Terminus add-on did not become healthy"
            docker logs terminus-smoke
            exit 1
          }
          echo "Terminus add-on healthy"
          docker rm -f terminus-smoke >/dev/null

      # Control run proves /config is readable unconfined, so a failure below
      # can only be AppArmor.
      - name: AppArmor denies Home Assistant's config
        if: matrix.tag == 'amd64' && steps.apparmor.outputs.enforced == 'true'
        run: |
          set -e
          mkdir -p /tmp/fake-ha-config
          echo "ha-secret" > /tmp/fake-ha-config/secrets.yaml

          docker run --rm --entrypoint cat \
            -v /tmp/fake-ha-config:/config:ro \
            trmnl-terminus:test-amd64 /config/secrets.yaml >/dev/null || {
              echo "::error::Control run could not read /config; the denial test would prove nothing"
              exit 1
            }
          echo "control: /config readable unconfined"

          if docker run --rm --entrypoint cat \
               --security-opt=apparmor=trmnl-terminus \
               -v /tmp/fake-ha-config:/config:ro \
               trmnl-terminus:test-amd64 /config/secrets.yaml >/dev/null 2>&1; then
            echo "::error::AppArmor did not block /config - the deny rule is not taking effect"
            exit 1
          fi
          echo "enforced: /config denied"
