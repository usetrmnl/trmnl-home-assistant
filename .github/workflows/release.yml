name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trmnl-ha
  CACHE_REPO: ${{ github.repository_owner }}/trmnl-ha-cache
  TERMINUS_IMAGE_NAME: ${{ github.repository_owner }}/trmnl-terminus
  TERMINUS_CACHE_REPO: ${{ github.repository_owner }}/trmnl-terminus-cache

# Tag prefix routes the build: terminus-v* -> trmnl-terminus, v* -> trmnl-ha.
jobs:
  build-and-push:
    name: Build & Push (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref_name, 'terminus-v') }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            cache_tag: amd64
          - platform: linux/arm64
            arch: aarch64
            cache_tag: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # NOTE: docker/metadata-action intelligently handles latest tag:
      # - Only applies 'latest' if this is the highest semver AND not a prerelease
      # - Skips 'latest' for prereleases (alpha, beta, rc) and older version hotfixes
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # NOTE: Uses registry cache from CI builds - no rebuild if layers unchanged!
      # cache_tag matches CI's naming (arm64) while arch is for image name (aarch64)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: trmnl-ha
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_REPO }}:${{ matrix.cache_tag }}
            type=gha,scope=build-${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_REPO }}:${{ matrix.cache_tag }},mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          provenance: false

  build-and-push-terminus:
    name: Build & Push Terminus (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref_name, 'terminus-v') }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            cache_tag: amd64
          - platform: linux/arm64
            arch: aarch64
            cache_tag: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must match config.yaml's version - Supervisor pulls image:version from there.
      - name: Extract and verify version
        id: version
        run: |
          version="${GITHUB_REF_NAME#terminus-v}"
          config_version=$(grep '^version:' trmnl-terminus/config.yaml | awk '{print $2}' | tr -d '"')
          if [ "$version" != "$config_version" ]; then
            echo "::error::Tag version ($version) does not match trmnl-terminus/config.yaml ($config_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve Terminus base image
        id: base
        working-directory: trmnl-terminus
        run: echo "image=$(grep "^  ${{ matrix.arch }}:" build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: trmnl-terminus
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.TERMINUS_IMAGE_NAME }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.TERMINUS_IMAGE_NAME }}-${{ matrix.arch }}:latest
          # Without these the base image's labels survive, and GitHub attaches the
          # package to usetrmnl/terminus rather than to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=trmnl-terminus
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.TERMINUS_CACHE_REPO }}:${{ matrix.cache_tag }}
            type=gha,scope=terminus-${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.TERMINUS_CACHE_REPO }}:${{ matrix.cache_tag }},mode=max
          provenance: false

  # A release holds file assets, and images live in the registry, so the pull
  # references are the only way to reach them from the release page.
  link-images:
    name: List the images on the release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-terminus]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write

    steps:
      - name: Append the pull references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          case "$TAG" in
            terminus-v*) image="trmnl-terminus"; version="${TAG#terminus-v}" ;;
            v*)          image="trmnl-ha";      version="${TAG#v}" ;;
            *)           echo "$TAG is not a release tag; nothing to link"; exit 0 ;;
          esac

          body=$(gh release view "$TAG" --json body --jq .body)

          # Re-running a release must not stack a second block onto the notes.
          # The substitution strips the trailing newlines the cut leaves behind,
          # without which every re-run grows the notes by a blank line.
          marker='<!-- images -->'
          body=$(printf '%s' "${body%%"$marker"*}")

          {
            printf '%s\n\n' "$body"
            printf '%s\n' "$marker"
            printf '### Images\n\n'
            for arch in amd64 aarch64; do
              printf -- '- `ghcr.io/%s/%s-%s:%s`\n' "$OWNER" "$image" "$arch" "$version"
            done
          } > /tmp/body.md

          gh release edit "$TAG" --notes-file /tmp/body.md
          echo "Listed ${image} ${version} images on ${TAG}"
