name: Release

on:
  release:
    types: [published]
  # terminus-release.yml sends this when RELEASE_PAT is unset. A release
  # created with GITHUB_TOKEN does not trigger the release event above.
  # github.ref on this event is the default branch, so the tag comes from
  # the payload and is checked before any image is pushed.
  repository_dispatch:
    types: [addon-release]

env:
  REGISTRY: ghcr.io

# Tag prefix routes the build: terminus-v* -> trmnl-terminus,
# larapaper-v* -> trmnl-larapaper, v* -> trmnl-ha.
jobs:
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            tag="$PAYLOAD_TAG"
          else
            tag="$REF_NAME"
          fi
          # The dispatch payload is caller-controlled. Refuse anything that
          # is not a release tag before it can reach checkout or a registry push.
          if [[ ! "$tag" =~ ^(terminus-v|larapaper-v|v)[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to build from '$tag'. Expected a v*, terminus-v* or larapaper-v* release tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag is $tag"

  build-and-push:
    name: Build & Push (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: release-tag
    if: ${{ needs.release-tag.result == 'success' && !startsWith(needs.release-tag.outputs.tag, 'terminus-v') && !startsWith(needs.release-tag.outputs.tag, 'larapaper-v') }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            cache_tag: amd64
          - platform: linux/arm64
            arch: aarch64
            cache_tag: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.tag }}

      - name: Lowercase the registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # NOTE: docker/metadata-action intelligently handles latest tag:
      # - Only applies 'latest' if this is the highest semver AND not a prerelease
      # - Skips 'latest' for prereleases (alpha, beta, rc) and older version hotfixes
      # value= is required: a repository_dispatch run's github.ref is the default branch.
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-ha-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-tag.outputs.tag }}
            type=semver,pattern={{major}},enable=${{ !startsWith(needs.release-tag.outputs.tag, 'v0.') }},value=${{ needs.release-tag.outputs.tag }}

      # NOTE: Uses registry cache from CI builds - no rebuild if layers unchanged!
      # cache_tag matches CI's naming (arm64) while arch is for image name (aarch64)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: trmnl-ha
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-ha-cache:${{ matrix.cache_tag }}
            type=gha,scope=build-${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-ha-cache:${{ matrix.cache_tag }},mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          provenance: false

  build-and-push-terminus:
    name: Build & Push Terminus (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: release-tag
    if: ${{ needs.release-tag.result == 'success' && startsWith(needs.release-tag.outputs.tag, 'terminus-v') }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            cache_tag: amd64
          - platform: linux/arm64
            arch: aarch64
            cache_tag: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.tag }}

      - name: Lowercase the registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must match config.yaml's version - Supervisor pulls image:version from there.
      - name: Extract and verify version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#terminus-v}"
          config_version=$(grep '^version:' trmnl-terminus/config.yaml | awk '{print $2}' | tr -d '"')
          if [ "$version" != "$config_version" ]; then
            echo "::error::Tag version ($version) does not match trmnl-terminus/config.yaml ($config_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve Terminus base image
        id: base
        working-directory: trmnl-terminus
        run: echo "image=$(grep "^  ${{ matrix.arch }}:" build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # repository_dispatch reports the default branch as github.sha. The
      # checkout above is the release tag, which is the commit that was built.
      - name: Resolve built revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: trmnl-terminus
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-terminus-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-terminus-${{ matrix.arch }}:latest
          # Without these the base image's labels survive, and GitHub attaches the
          # package to usetrmnl/terminus rather than to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=trmnl-terminus
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-terminus-cache:${{ matrix.cache_tag }}
            type=gha,scope=terminus-${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-terminus-cache:${{ matrix.cache_tag }},mode=max
          provenance: false

  build-and-push-larapaper:
    name: Build & Push LaraPaper (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: release-tag
    if: ${{ needs.release-tag.result == 'success' && startsWith(needs.release-tag.outputs.tag, 'larapaper-v') }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            cache_tag: amd64
          - platform: linux/arm64
            arch: aarch64
            cache_tag: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.tag }}

      - name: Lowercase the registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must match config.yaml's version - Supervisor pulls image:version from there.
      - name: Extract and verify version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#larapaper-v}"
          config_version=$(grep '^version:' trmnl-larapaper/config.yaml | awk '{print $2}' | tr -d '"')
          if [ "$version" != "$config_version" ]; then
            echo "::error::Tag version ($version) does not match trmnl-larapaper/config.yaml ($config_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve LaraPaper base image
        id: base
        working-directory: trmnl-larapaper
        run: echo "image=$(grep "^  ${{ matrix.arch }}:" build.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # repository_dispatch reports the default branch as github.sha. The
      # checkout above is the release tag, which is the commit that was built.
      - name: Resolve built revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: trmnl-larapaper
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-larapaper-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-larapaper-${{ matrix.arch }}:latest
          # Without these the base image's labels survive, and GitHub attaches the
          # package to usetrmnl/larapaper rather than to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=trmnl-larapaper
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-larapaper-cache:${{ matrix.cache_tag }}
            type=gha,scope=larapaper-${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/trmnl-larapaper-cache:${{ matrix.cache_tag }},mode=max
          provenance: false

  # A release holds file assets, and images live in the registry, so the pull
  # references are the only way to reach them from the release page.
  link-images:
    name: List the images on the release
    runs-on: ubuntu-latest
    needs: [release-tag, build-and-push, build-and-push-terminus, build-and-push-larapaper]
    if: ${{ !cancelled() && needs.release-tag.result == 'success' && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write

    steps:
      - name: Append the pull references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job skips actions/checkout, so gh has no git remote to read the
          # repository from and needs telling outright.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-tag.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Same lowercase rule as the image build. A mixed-case owner makes
          # the pull command in the release notes an invalid Docker reference.
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')

          case "$TAG" in
            terminus-v*) image="trmnl-terminus"; version="${TAG#terminus-v}" ;;
            larapaper-v*) image="trmnl-larapaper"; version="${TAG#larapaper-v}" ;;
            v*)          image="trmnl-ha";      version="${TAG#v}" ;;
            *)           echo "$TAG is not a release tag; nothing to link"; exit 0 ;;
          esac

          body=$(gh release view "$TAG" --json body --jq .body)

          # Re-running a release must not stack a second block onto the notes.
          # The substitution strips the trailing newlines the cut leaves behind,
          # without which every re-run grows the notes by a blank line.
          marker='<!-- images -->'
          body=$(printf '%s' "${body%%"$marker"*}")

          {
            printf '%s\n\n' "$body"
            printf '%s\n' "$marker"
            printf '### Images\n\n'
            for arch in amd64 aarch64; do
              printf -- '- `ghcr.io/%s/%s-%s:%s`\n' "$owner" "$image" "$arch" "$version"
            done
          } > /tmp/body.md

          gh release edit "$TAG" --notes-file /tmp/body.md
          echo "Listed ${image} ${version} images on ${TAG}"
