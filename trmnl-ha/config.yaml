name: "TRMNL HA"
description: "Send dashboard screens to your TRMNL"
version: "0.11.1"
slug: "trmnl-ha"
url: "https://github.com/usetrmnl/trmnl-home-assistant"
image: ghcr.io/usetrmnl/trmnl-ha-{arch}
# NOTE: Uncomment after setting up Codenotary signing in CI
# codenotary: dev@usetrmnl.com
homeassistant_api: true
init: false # Image ships its own init (tini) to reap orphaned Chromium children (#72)
apparmor: true
watchdog: "http://[HOST]:10000/health"
arch:
  - aarch64
  - amd64
stage: stable

# Enable ingress for sidebar integration
# NOTE: ingress_port must match DEFAULT_SERVER_PORT in const.ts
ingress: true
ingress_port: 10000
ingress_stream: false

# Sidebar integration
panel_icon: "mdi:monitor"
panel_title: "TRMNL HA"

# Keep ports for backward compatibility (optional direct access)
ports:
  10000/tcp: 10000
ports_description:
  10000/tcp: "Web UI and API (direct access)"

# Configuration options
options:
  trmnl_account_token: ""
  refresh_schedules: []
  access_token: ""
  home_assistant_url: "http://homeassistant:8123"
  timezone: ""
  keep_browser_open: false
  debug_logging: false
  server_port: 10000
  navigation_timeout_ms: 30000
  timestamp_overlay: false
  timestamp_12h: false

# Schema for options validation
schema:
  trmnl_account_token: password?
  refresh_schedules:
    - schedule_id: str
      device_id: int(1,)
      lead_seconds: int(60,600)
      fallback_interval_seconds: int(60,86400)
      initial_intervals_seconds:
        - int(60,86400)
  access_token: str
  home_assistant_url: str?
  timezone: str?
  keep_browser_open: bool?
  debug_logging: bool?
  server_port: "int(1024,65535)?"
  navigation_timeout_ms: "int(10000,180000)?"
  timestamp_overlay: bool?
  timestamp_12h: bool?

# Exclude regeneratable data from HA backups
backup_exclude:
  - "*/logs/*"
  - "*/output/*"
