---
name: LaraPaper (BYOS)
version: "0.49.0"
slug: trmnl-larapaper
description: >-
  Runs LaraPaper, a self-hosted TRMNL server (BYOS) with recipes, playlists and
  mashups, with its web UI inside Home Assistant
url: https://github.com/usetrmnl/trmnl-home-assistant
image: ghcr.io/usetrmnl/trmnl-larapaper-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: services
# The Supervisor token reaches Home Assistant's API, for the read-only proxy recipes can
# use (home_assistant_key); the token stays root-only, out of LaraPaper's reach
homeassistant_api: true
stage: experimental
# The web UI through Home Assistant (sidebar, Open Web UI), also away from home;
# ingress_port is left at its default, 8099
ingress: true
panel_icon: mdi:tablet-dashboard
panel_title: LaraPaper
# The TRMNL device API (and the web UI) on the home network
ports:
  8080/tcp: 4567
ports_description:
  8080/tcp: TRMNL device API and LaraPaper web UI
options:
  app_url: ""
  multiuser_registration: false
  log_level: info
  home_assistant_key: ""
  env_vars: []
schema:
  app_url: url
  multiuser_registration: bool
  log_level: list(debug|info|notice|warning|error|critical)
  transform_runner_url: url?
  transform_runner_token: password?
  # masked in the UI; the entrypoint checks its format (it goes into nginx config)
  home_assistant_key: password?
  env_vars:
    - name: match(^[A-Z][A-Z0-9_]*$)
      value: str
