---
name: Terminus Server (BYOS)
version: "0.71.0"
slug: trmnl-terminus
description: >-
  Starts a Terminus Server that enables local management of TRMNL devices (BYOS)
url: https://github.com/usetrmnl/trmnl-home-assistant
image: ghcr.io/usetrmnl/trmnl-terminus-{arch}
# NOTE: Uncomment after setting up Codenotary signing in CI
# codenotary: dev@usetrmnl.com
arch:
  - aarch64
  - amd64
init: false
startup: application
timeout: 90
stage: stable
apparmor: true
ports:
  2300/tcp: 2300
ports_description:
  2300/tcp: Terminus Web Interface and API (direct access)
webui: http://[HOST]:[PORT:2300]
watchdog: http://[HOST]:[PORT:2300]/up
# Stop the add-on first: a hot copy of a running Postgres data dir restores torn
backup: cold
backup_exclude:
  - "*/logs/*"
  - "*/tmp/*"
options:
  # Terminus expires a session 24 hours after login however often its token is
  # refreshed, which a scheduled push cannot survive unattended. Its own
  # default suits a server on the open internet; this one suits the trusted
  # network the add-on is built for.
  session_expiration_enabled: false
schema:
  ha_ip: str
  # Optional Terminus tunables. Each key maps to the env var of the same name,
  # uppercased, and is only exported when set, so Terminus keeps its own
  # defaults otherwise. See https://github.com/usetrmnl/terminus/blob/main/doc/configuration.adoc
  api_access_token_period: int(60,)?
  session_expiration_enabled: bool?
  session_inactivity_limit: int(60,)?
  session_lifetime_limit: int(60,)?
  ferrum_default_timeout: int(1,)?
  ferrum_process_timeout: int(1,)?
  ferrum_javascript_errors: bool?
  http_timeout_connect: int(1,)?
  http_timeout_read: int(1,)?
  http_timeout_write: int(1,)?
  hanami_max_threads: int(1,)?
  hanami_min_threads: int(1,)?
  hanami_web_concurrency: int(0,)?
  firmware_synchronizer: bool?
  font_synchronizer: bool?
  model_synchronizer: bool?
  screen_synchronizer: bool?
  rack_attack_allowed_subnets: str?
